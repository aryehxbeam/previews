<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP Agent Test Grid</title>
<style>
  :root {
    --bg: #f6f4ef;          /* warm off-white */
    --panel: #fbfaf6;
    --panel-2: #f0ede5;
    --border: #e2ded2;
    --text: #2a2a2e;
    --muted: #6b6b73;
    --accent: #3361b8;       /* muted blue */
    --accent-2: #7a4ec7;     /* muted violet */
    --pill: #ece8dc;
    --warn: #b27317;
    --good: #2f7a4d;
    --bad:  #b1364d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 22px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .stats { margin-left: auto; display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
  header .stats b { color: var(--text); font-weight: 600; }

  .controls { padding: 14px 28px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; justify-content: flex-end; background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; }
  .chip { padding: 4px 9px; border-radius: 999px; background: var(--pill); color: var(--text); font-size: 12px; cursor: pointer; user-select: none; border: 1px solid transparent; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #0c1322; border-color: var(--accent); font-weight: 600; }
  .chip.small { font-size: 11px; padding: 2px 7px; }
  .chip.use-case { background: rgba(122,78,199,0.10); color: var(--accent-2); border: 1px solid rgba(122,78,199,0.30); }
  .chip.category  { background: rgba(51,97,184,0.08); color: var(--accent);   border: 1px solid rgba(51,97,184,0.28); }
  .chip.variant-type { background: rgba(178,115,23,0.10); color: var(--warn); border: 1px solid rgba(178,115,23,0.30); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .controls .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 12px; }
  .controls .btn:hover { border-color: var(--accent); }

  main { padding: 24px 28px 80px; display: grid; grid-template-columns: 280px 1fr; gap: 28px; max-width: 1500px; margin: 0 auto; }

  aside { position: sticky; top: 74px; align-self: start; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; max-height: calc(100vh - 100px); overflow: auto; }
  aside h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  aside .filter-section + .filter-section { margin-top: 18px; }
  aside .count { color: var(--muted); font-size: 11px; margin-left: 4px; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  .card-desc { color: var(--muted); margin: 8px 0 14px; font-size: 13px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }

  .template { background: var(--panel-2); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 6px; margin: 4px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.55; cursor: pointer; position: relative; color: var(--text); }
  .template:hover { background: #e8e4d6; }
  .template .ph { color: var(--accent-2); }
  .template.variant { border-left-color: var(--warn); }
  .variant-row { display: flex; align-items: flex-start; gap: 10px; margin: 4px 0; }
  .variant-row .variant-label { flex-shrink: 0; min-width: 80px; padding-top: 8px; }
  .variant-row .template { flex: 1; }

  .ph-table { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 12px; }
  .ph-table dt { color: var(--accent-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ph-table dd { margin: 0; color: var(--muted); }

  .real-list { margin: 6px 0 0; padding: 0; list-style: none; max-height: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .real-list li { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .real-list li:last-child { border-bottom: none; }
  .real-list .q { color: var(--text); line-height: 1.4; }
  .real-list .tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .real-list .tool-pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; padding: 1px 6px; background: rgba(51,97,184,0.08); color: var(--accent); border: 1px solid rgba(51,97,184,0.25); border-radius: 3px; }

  .gen-row { display: flex; gap: 8px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .gen-out { flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--good); min-height: 20px; }
  .gen-out:empty::before { content: "press Generate to roll a filled-in question"; color: var(--muted); font-style: italic; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--good); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100; }
  .toast.show { opacity: 1; }

  .empty { padding: 60px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; }

  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 6px 0; list-style: none; }
  details > summary::before { content: "▸ "; display: inline-block; transition: transform 0.15s; }
  details[open] > summary::before { transform: rotate(90deg); }

  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; }
  }
</style>
</head>
<body>

<header>
  <h1>MCP Agent Test Grid</h1>
  <span class="sub">Generalized question templates derived from real user traffic</span>
  <div class="stats">
    <span><b id="stat-intents">0</b> intents</span>
    <span><b id="stat-templates">0</b> templates</span>
    <span><b id="stat-variants">0</b> variants</span>
    <span><b id="stat-real">0</b> real captures (30d, tool-using)</span>
    <span><b id="stat-usecases">0</b> use-cases</span>
  </div>
</header>

<div class="controls">
  <button class="btn" id="generate-all">Roll all</button>
  <button class="btn" id="copy-all">Copy filled list</button>
</div>

<main>
  <aside>
    <div class="filter-section">
      <h3>Your partners <span class="count" id="partner-count"></span></h3>
      <textarea id="partner-input" rows="5"
                placeholder="Paste partner names — one per line or comma-separated."
                style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif;resize:vertical;"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button class="btn" id="partner-clear" style="flex:1;font-size:11px;">clear</button>
        <button class="btn" id="partner-sample" style="flex:1;font-size:11px;">use samples</button>
      </div>
    </div>
    <div class="filter-section">
      <h3>Your accounts <span class="count" id="account-count"></span></h3>
      <textarea id="account-input" rows="5"
                placeholder="Paste account names — one per line or comma-separated. Used for {account} fills."
                style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif;resize:vertical;"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button class="btn" id="account-clear" style="flex:1;font-size:11px;">clear</button>
        <button class="btn" id="account-sample" style="flex:1;font-size:11px;">use samples</button>
      </div>
    </div>
    <div class="filter-section">
      <h3>Partner tags <span class="count" id="tag-count"></span></h3>
      <textarea id="tag-input" rows="4"
                placeholder="Paste partner tags — one per line or comma-separated. Used for {tag} fills."
                style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif;resize:vertical;"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button class="btn" id="tag-clear" style="flex:1;font-size:11px;">clear</button>
        <button class="btn" id="tag-sample" style="flex:1;font-size:11px;">use samples</button>
      </div>
    </div>
    <div class="filter-section">
      <h3>Use case <span class="count" id="use-case-count"></span></h3>
      <div class="chip-group" id="use-case-filter"></div>
    </div>
    <div class="filter-section">
      <h3>Source category <span class="count" id="category-count"></span></h3>
      <div class="chip-group" id="category-filter"></div>
    </div>
    <div class="filter-section">
      <h3>Variant type</h3>
      <div class="chip-group" id="variant-filter"></div>
    </div>
    <div class="filter-section">
      <button class="btn" id="reset-filters" style="width:100%">Reset filters</button>
    </div>
  </aside>

  <div class="grid" id="grid"></div>
</main>

<div class="toast" id="toast">copied</div>

// ------------------------------------------------------------------
// RENDERING
// ------------------------------------------------------------------
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

const state = {
  useCases: new Set(),
  categories: new Set(),
  variantTypes: new Set(),
};

const ALL_USE_CASES = [...new Set(INTENTS.flatMap(i => i.useCases))].sort();
const ALL_CATEGORIES = [...new Set(INTENTS.map(i => i.sourceCategory))].sort();
const ALL_VARIANT_TYPES = [...new Set(INTENTS.flatMap(i => Object.keys(i.variants)))].sort();

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

const LS_PARTNERS = "mcp_test_grid_partners_v2";
const LS_ACCOUNTS = "mcp_test_grid_accounts_v2";
const LS_TAGS     = "mcp_test_grid_tags";

function parseList(raw) {
  return raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
}

function applyPartners(list) {
  const effective = list.length ? list : SAMPLE_PARTNERS;
  PLACEHOLDERS.partner   = effective;
  PLACEHOLDERS.partner_a = effective;
  PLACEHOLDERS.partner_b = effective;
  PLACEHOLDERS.partner_c = effective;
  const countEl = document.getElementById("partner-count");
  if (countEl) countEl.textContent = list.length ? `(${list.length})` : `(samples)`;
}

function applyAccounts(list) {
  const effective = list.length ? list : SAMPLE_ACCOUNTS;
  PLACEHOLDERS.account   = effective;
  PLACEHOLDERS.account_a = effective;
  PLACEHOLDERS.account_b = effective;
  PLACEHOLDERS.account_c = effective;
  const countEl = document.getElementById("account-count");
  if (countEl) countEl.textContent = list.length ? `(${list.length})` : `(samples)`;
}

function applyTags(list) {
  const effective = list.length ? list : SAMPLE_TAGS;
  PLACEHOLDERS.tag = effective;
  const countEl = document.getElementById("tag-count");
  if (countEl) countEl.textContent = list.length ? `(${list.length})` : `(samples)`;
}

function lsLoad(key) { try { return localStorage.getItem(key); } catch { return null; } }
function lsSave(key, raw) { try { localStorage.setItem(key, raw); } catch {} }

// Returns the stored value, or - on first visit (key never set) - seeds with the sample list.
function lsLoadOrSeed(key, sampleList) {
  const stored = lsLoad(key);
  if (stored === null) {
    const seeded = sampleList.join("\n");
    lsSave(key, seeded);
    return seeded;
  }
  return stored;
}
function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function highlightPlaceholders(s) {
  return escapeHtml(s).replace(/\{([a-z_]+)\}/g, '<span class="ph">{$1}</span>');
}
// Derived placeholders that re-shape the chosen name at fill time.
// These let probes test how the agent handles common distortions
// (lowercase, no-suffix, fuzzy domain, typo) without baking literal examples in.
function deriveAccountForm(name, form) {
  switch (form) {
    case "lc":     return name.toLowerCase();
    case "short":  return name.replace(/\s+(Inc|LLC|Pty|GmbH|Co|Corp|Ltd|Group|International|Industries|Robotics|Consortium|Technologies|DAO|Protocol|Labs|Energy|Power|Orbital|Pharma|Colony)\.?$/i, "").trim();
    case "domain": return name.toLowerCase().replace(/[^a-z0-9]+/g, "") + ".com";
    case "typo":   return mangle(name);
    default:       return name;
  }
}

// Introduce a single realistic typo: char swap, drop, double, or substitute.
function mangle(name) {
  if (!name || name.length < 3) return name;
  const chars = name.split("");
  // Pick an index in the inner portion of the name (skip first/last for readability)
  const i = 1 + Math.floor(Math.random() * (chars.length - 2));
  const op = Math.floor(Math.random() * 4);
  switch (op) {
    case 0: { // swap with neighbor
      [chars[i], chars[i + 1]] = [chars[i + 1], chars[i]];
      break;
    }
    case 1: { // drop
      chars.splice(i, 1);
      break;
    }
    case 2: { // double
      chars.splice(i, 0, chars[i]);
      break;
    }
    case 3: { // substitute with adjacent keyboard key (rough)
      const adj = { a: "s", e: "r", i: "o", o: "i", u: "y", s: "a", t: "y", y: "u", r: "t" };
      const c = chars[i].toLowerCase();
      if (adj[c]) chars[i] = chars[i] === c ? adj[c] : adj[c].toUpperCase();
      else chars.splice(i, 1);
      break;
    }
  }
  return chars.join("");
}

function fill(template) {
  return template.replace(/\{([a-z_]+)\}/g, (_, key) => {
    // Direct hit
    if (PLACEHOLDERS[key]) return String(pick(PLACEHOLDERS[key]));

    // Derived account forms: account_lc, account_short, account_domain, account_typo
    const accMatch = key.match(/^account_(lc|short|domain|typo)$/);
    if (accMatch) return deriveAccountForm(pick(PLACEHOLDERS.account), accMatch[1]);

    // Derived partner forms: partner_lc, partner_short (drop suffix), partner_typo
    const ptMatch = key.match(/^partner_(lc|short|typo)$/);
    if (ptMatch) return deriveAccountForm(pick(PLACEHOLDERS.partner), ptMatch[1]);

    return `{${key}}`;
  });
}

function renderFilters() {
  const ucEl = $("#use-case-filter");
  ucEl.innerHTML = ALL_USE_CASES.map(uc =>
    `<div class="chip use-case small" data-uc="${uc}">${uc}</div>`
  ).join("");
  ucEl.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const uc = c.dataset.uc;
    state.useCases.has(uc) ? state.useCases.delete(uc) : state.useCases.add(uc);
    c.classList.toggle("active");
    render();
  });
  $("#use-case-count").textContent = `(${ALL_USE_CASES.length})`;

  const catEl = $("#category-filter");
  catEl.innerHTML = ALL_CATEGORIES.map(cat =>
    `<div class="chip category small" data-cat="${cat}">${cat}</div>`
  ).join("");
  catEl.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const cat = c.dataset.cat;
    state.categories.has(cat) ? state.categories.delete(cat) : state.categories.add(cat);
    c.classList.toggle("active");
    render();
  });
  $("#category-count").textContent = `(${ALL_CATEGORIES.length})`;

  const varEl = $("#variant-filter");
  varEl.innerHTML = ALL_VARIANT_TYPES.map(v =>
    `<div class="chip variant-type small" data-v="${v}">${v}</div>`
  ).join("");
  varEl.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const v = c.dataset.v;
    state.variantTypes.has(v) ? state.variantTypes.delete(v) : state.variantTypes.add(v);
    c.classList.toggle("active");
    render();
  });
}

function intentMatches(intent) {
  if (state.useCases.size && !intent.useCases.some(uc => state.useCases.has(uc))) return false;
  if (state.categories.size && !state.categories.has(intent.sourceCategory)) return false;
  if (state.variantTypes.size && !Object.keys(intent.variants).some(v => state.variantTypes.has(v))) return false;
  return true;
}

function renderIntent(intent) {
  const templates = intent.templates.map(t =>
    `<div class="template" data-tpl="${escapeHtml(t)}" title="click to roll a filled version">${highlightPlaceholders(t)}</div>`
  ).join("");

  const variants = Object.entries(intent.variants).map(([type, v]) =>
    `<div class="variant-row">
       <span class="chip variant-type small variant-label">${type}</span>
       <div class="template variant" data-tpl="${escapeHtml(v)}" title="click to roll a filled version">${highlightPlaceholders(v)}</div>
     </div>`
  ).join("");

  const uc = intent.useCases.length
    ? intent.useCases.map(u => `<span class="chip use-case small">${u}</span>`).join(" ")
    : `<span class="chip variant-type small">none — should refuse</span>`;

  const placeholderKeys = [...new Set(
    [...intent.templates, ...Object.values(intent.variants)]
      .flatMap(t => Array.from(t.matchAll(/\{([a-z_]+)\}/g)).map(m => m[1]))
  )];
  const phRows = placeholderKeys.length
    ? `<dl class="ph-table">${placeholderKeys.map(k => `<dt>{${k}}</dt><dd>${(PLACEHOLDERS[k] || ["(no fills defined)"]).join(", ")}</dd>`).join("")}</dl>`
    : `<div style="color:var(--muted);font-size:12px">no placeholders</div>`;

  // Real captures from the 30-day dashboard. sourceCategory may be a single string,
  // an array (for the "Missing From ..." intent that spans 3 cats), or "cross-cutting".
  const cats = Array.isArray(intent.sourceCategory) ? intent.sourceCategory : [intent.sourceCategory];
  // Handle slash-separated like "Missing From Other List / Revenue / Overlap"
  const realCats = cats.flatMap(c => typeof c === 'string' && c.includes(" / ")
    ? c.split(" / ").map(s => s.trim()).map(s => s === "Other" ? "Missing From Other List" : s === "Revenue" ? "Missing From Revenue List" : s === "Overlap" ? "Missing From Overlap List" : s)
    : [c]);
  const realItems = realCats.flatMap(c => REAL_QUESTIONS[c] || []);
  const realCapturesBlock = realItems.length
    ? `<details style="margin-top:14px">
         <summary>real captures from "${realCats.join(', ')}" (${realItems.length})</summary>
         <ul class="real-list">
           ${realItems.map(item => `
             <li>
               <div class="q">${escapeHtml(item.q)}</div>
               <div class="tools">${(item.tools || []).map(t => `<span class="tool-pill">${escapeHtml(t)}</span>`).join("")}</div>
             </li>
           `).join("")}
         </ul>
       </details>`
    : "";

  return `
    <div class="card" data-intent="${intent.name}">
      <div class="card-head">
        <h2>${escapeHtml(intent.name)}</h2>
        <span class="chip category small">${intent.sourceCategory}</span>
        ${intent.expectedBehavior ? `<span class="chip variant-type small">expect: ${intent.expectedBehavior}</span>` : ""}
      </div>
      <div class="card-desc">${escapeHtml(intent.description)}</div>

      <div class="section-label">canonical template${intent.templates.length > 1 ? "s" : ""}</div>
      ${templates}

      ${variants ? `<div class="section-label">variants</div>${variants}` : ""}

      <details>
        <summary>placeholders &amp; fills (${placeholderKeys.length})</summary>
        <div style="margin-top:8px">${phRows}</div>
      </details>

      ${realCapturesBlock}

      <div class="section-label" style="margin-top:14px">use-cases</div>
      <div>${uc}</div>

      <div class="gen-row">
        <button class="btn gen-btn">Roll one</button>
        <div class="gen-out"></div>
        <button class="btn copy-btn" title="copy rolled output">copy</button>
      </div>
    </div>
  `;
}

function render() {
  const filtered = INTENTS.filter(intentMatches);
  const grid = $("#grid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">No intents match the current filters.</div>`;
  } else {
    grid.innerHTML = filtered.map(renderIntent).join("");
  }
}

function bindGridActions() {
  $("#grid").addEventListener("click", e => {
    const card = e.target.closest(".card"); if (!card) return;
    const intent = INTENTS.find(i => i.name === card.dataset.intent);
    if (!intent) return;

    if (e.target.closest(".gen-btn") || (e.target.closest(".template") && !e.target.closest(".gen-row"))) {
      const clickedTpl = e.target.closest(".template");
      const tpl = clickedTpl
        ? clickedTpl.dataset.tpl
        : pick([...intent.templates, ...Object.values(intent.variants)]);
      const out = card.querySelector(".gen-out");
      out.textContent = fill(tpl);
    }

    if (e.target.closest(".copy-btn")) {
      const out = card.querySelector(".gen-out");
      if (out.textContent.trim()) {
        navigator.clipboard.writeText(out.textContent).then(() => toast("copied"));
      } else {
        toast("nothing rolled yet");
      }
    }
  });
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1200);
}

function rollAll() {
  $$(".card").forEach(card => {
    const intent = INTENTS.find(i => i.name === card.dataset.intent);
    const tpl = pick([...intent.templates, ...Object.values(intent.variants)]);
    card.querySelector(".gen-out").textContent = fill(tpl);
  });
}

function copyAll() {
  const lines = [];
  $$(".card").forEach(card => {
    const intent = INTENTS.find(i => i.name === card.dataset.intent);
    const tpl = pick([...intent.templates, ...Object.values(intent.variants)]);
    lines.push(`# ${intent.name}\n${fill(tpl)}`);
  });
  navigator.clipboard.writeText(lines.join("\n\n")).then(() => toast(`copied ${lines.length} questions`));
}

function init() {
  $("#stat-intents").textContent = INTENTS.length;
  $("#stat-templates").textContent = INTENTS.reduce((n, i) => n + i.templates.length, 0);
  $("#stat-variants").textContent = INTENTS.reduce((n, i) => n + Object.keys(i.variants).length, 0);
  $("#stat-real").textContent = Object.values(REAL_QUESTIONS).reduce((n, arr) => n + arr.length, 0);
  $("#stat-usecases").textContent = ALL_USE_CASES.length;

  // Restore partners from localStorage (seed with samples on first visit)
  const partnerInput = $("#partner-input");
  partnerInput.value = lsLoadOrSeed(LS_PARTNERS, SAMPLE_PARTNERS);
  applyPartners(parseList(partnerInput.value));
  partnerInput.addEventListener("input", e => {
    lsSave(LS_PARTNERS, e.target.value);
    applyPartners(parseList(e.target.value));
    render();
  });
  $("#partner-clear").addEventListener("click", () => {
    partnerInput.value = ""; lsSave(LS_PARTNERS, ""); applyPartners([]); render(); toast("cleared — using sample partners");
  });
  $("#partner-sample").addEventListener("click", () => {
    partnerInput.value = SAMPLE_PARTNERS.join("\n");
    lsSave(LS_PARTNERS, partnerInput.value);
    applyPartners(SAMPLE_PARTNERS);
    render();
    toast("loaded sample partners");
  });

  // Restore accounts from localStorage (seed with samples on first visit)
  const accountInput = $("#account-input");
  accountInput.value = lsLoadOrSeed(LS_ACCOUNTS, SAMPLE_ACCOUNTS);
  applyAccounts(parseList(accountInput.value));
  accountInput.addEventListener("input", e => {
    lsSave(LS_ACCOUNTS, e.target.value);
    applyAccounts(parseList(e.target.value));
    render();
  });
  $("#account-clear").addEventListener("click", () => {
    accountInput.value = ""; lsSave(LS_ACCOUNTS, ""); applyAccounts([]); render(); toast("cleared — using sample accounts");
  });
  $("#account-sample").addEventListener("click", () => {
    accountInput.value = SAMPLE_ACCOUNTS.join("\n");
    lsSave(LS_ACCOUNTS, accountInput.value);
    applyAccounts(SAMPLE_ACCOUNTS);
    render();
    toast("loaded sample accounts");
  });

  // Restore tags from localStorage (seed with samples on first visit)
  const tagInput = $("#tag-input");
  tagInput.value = lsLoadOrSeed(LS_TAGS, SAMPLE_TAGS);
  applyTags(parseList(tagInput.value));
  tagInput.addEventListener("input", e => {
    lsSave(LS_TAGS, e.target.value);
    applyTags(parseList(e.target.value));
    render();
  });
  $("#tag-clear").addEventListener("click", () => {
    tagInput.value = ""; lsSave(LS_TAGS, ""); applyTags([]); render(); toast("cleared — using sample tags");
  });
  $("#tag-sample").addEventListener("click", () => {
    tagInput.value = SAMPLE_TAGS.join("\n");
    lsSave(LS_TAGS, tagInput.value);
    applyTags(SAMPLE_TAGS);
    render();
    toast("loaded sample tags");
  });

  renderFilters();
  render();
  bindGridActions();

  $("#generate-all").addEventListener("click", rollAll);
  $("#copy-all").addEventListener("click", copyAll);
  $("#reset-filters").addEventListener("click", () => {
    state.useCases.clear(); state.categories.clear(); state.variantTypes.clear();
    $$(".chip.active").forEach(c => c.classList.remove("active"));
    render();
  });
}

init();
</script>
